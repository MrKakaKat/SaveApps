name: Build APKs

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: gradle assembleRelease --no-daemon
      - name: Collect APKs
        run: |
          mkdir out
          for app in savex savetok savetube; do
            cp $app/build/outputs/apk/release/*.apk "out/${app^}.apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/*.apk
      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: false
          make_latest: true
          files: out/*.apk
